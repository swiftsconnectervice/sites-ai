function useParallax(speed) {
  const wrapperRef = useRef(null), innerRef = useRef(null);
  const targetRef = useRef(0), currentRef = useRef(0), rafRef = useRef(null);
  useEffect(function() {
    const compute = function() {
      const w = wrapperRef.current;
      if (!w) return;
      const r = w.getBoundingClientRect();
      targetRef.current = ((r.top + r.height/2) - window.innerHeight/2) * -speed;
    };
    const loop = function() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        if (innerRef.current) innerRef.current.style.transform = "";
      } else {
        compute();
        currentRef.current += (targetRef.current - currentRef.current) * 0.1;
        if (innerRef.current) innerRef.current.style.transform = "translate3d(0, " + currentRef.current + "px, 0)";
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    window.addEventListener('resize', compute);
    return function() { cancelAnimationFrame(rafRef.current); window.removeEventListener('resize', compute); };
  }, [speed]);
  return { wrapperRef: wrapperRef, innerRef: innerRef };
}

function useReveal(delay) {
  const ref = useRef(null);
  useEffect(function() {
    const el = ref.current;
    if (!el) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.classList.add('is-visible'); return; }
    const io = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) { setTimeout(function(){ el.classList.add('is-visible'); }, delay); io.unobserve(entry.target); }
      });
    }, { threshold: 0.15 });
    io.observe(el);
    return function() { io.disconnect(); };
  }, [delay]);
  return ref;
}

function HeroBox3D(props) {
  const mountRef = useRef(null);
  const [state, setState] = useState('loading');

  useEffect(function() {
    if (!HERO_BOX_URL || !window.THREE) { setState('fallback'); return; }
    const mount = mountRef.current;
    if (!mount) return;
    let renderer, raf, model;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(mount.clientWidth, mount.clientHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      mount.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, mount.clientWidth / mount.clientHeight, 0.1, 100);
      camera.position.set(0, 0.4, 4);

      // Ambiente para que el chrome refleje algo (si falla, sigue funcionando)
      try {
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
      } catch (e) {}

      const hemi = new THREE.HemisphereLight(0xffffff, 0x8f959f, 0.6);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xffffff, 1.1);
      dir.position.set(2, 3, 2);
      scene.add(dir);

      const draco = new THREE.DRACOLoader();
      draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      const loader = new THREE.GLTFLoader();
      loader.setDRACOLoader(draco);

      loader.load(HERO_BOX_URL, function(gltf) {
        model = gltf.scene;
        // Auto-centra y auto-escala cualquier .glb, mida lo que mida
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const s = 2.2 / maxDim;
        model.scale.setScalar(s);
        model.position.sub(center.multiplyScalar(s));
        scene.add(model);

        // Re-encuadre: calcula la distancia exacta para que el modelo entre completo
        const box2 = new THREE.Box3().setFromObject(model);
        const size2 = box2.getSize(new THREE.Vector3());
        const c2 = box2.getCenter(new THREE.Vector3());
        const maxDim2 = Math.max(size2.x, size2.y, size2.z) || 1;
        const fov = 35;
        const fitDist = (maxDim2 / 2) / Math.tan((fov * Math.PI) / 360);
        camera.position.set(0, maxDim2 * 0.15, fitDist * 1.45);
        camera.lookAt(c2.x, c2.y, c2.z);

        setState('ready');
      }, undefined, function() {
        setState('fallback');
      });

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const clock = new THREE.Clock();
      const loop = function() {
        raf = requestAnimationFrame(loop);
        if (model && !reduced) model.rotation.y = clock.getElapsedTime() * 0.25;
        renderer.render(scene, camera);
      };
      loop();

      const onResize = function() {
        const w = mount.clientWidth, h = mount.clientHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      };
      window.addEventListener('resize', onResize);

      return function() {
        cancelAnimationFrame(raf);
        window.removeEventListener('resize', onResize);
        try { renderer.dispose(); } catch (e) {}
      };
    } catch (e) {
      setState('fallback');
    }
  }, []);

  if (!HERO_BOX_URL || state === 'fallback') {
    return <AssetPlaceholder variant="box" className={props.className} />;
  }
  return (
    <div className={"relative " + props.className}>
      <div ref={mountRef} className="absolute inset-0" />
      {state === 'loading' ? <AssetPlaceholder variant="box" className="absolute inset-0" /> : null}
    </div>
  );
}

function VideoScroll() {
  const sectionRef = useRef(null);
  const videoRef = useRef(null);
  const [p, setP] = useState(0);
  const targetP = useRef(0), currentP = useRef(0);
  useEffect(function() {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const onScroll = function() {
      const el = sectionRef.current;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const sectionHeight = el.offsetHeight, viewH = window.innerHeight;
      const traveled = Math.min(Math.max(-rect.top, 0), sectionHeight - viewH);
      targetP.current = Math.min(Math.max(traveled / ((sectionHeight - viewH) || 1), 0), 1);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    let raf = 0;
    const loop = function() {
      if (reduced) { currentP.current = targetP.current; }
      else { currentP.current += (targetP.current - currentP.current) * 0.12; }
      setP(currentP.current);
      const v = videoRef.current;
      if (v && v.readyState >= 1 && v.duration) {
        const t = currentP.current * (v.duration - 0.05);
        if (Math.abs(v.currentTime - t) > 0.01) { try { v.currentTime = t; } catch (e) {} }
      }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return function() { cancelAnimationFrame(raf); window.removeEventListener('scroll', onScroll); };
  }, []);
  const chapter = p < 1/3 ? 0 : p < 2/3 ? 1 : 2;
  const captions = [
    { cap: "CAP. 01 — MAR", line: "La caja toca cubierta." },
    { cap: "CAP. 02 — TIERRA", line: "Rueda a toda ciudad." },
    { cap: "CAP. 03 — AIRE", line: "Cruza el mapa en horas." }
  ];
  const vehicles = ["ship", "truck", "plane"];
  const showHint = p < 0.04;
  return (
    <section ref={sectionRef} className="relative" style={{ height: '320vh' }}>
      <div className="sticky top-0 h-screen overflow-hidden">
  {/* Capa 1: fondo cielo (fallback si no hay video) */}
  <div className="absolute inset-0" style={{ background: 'radial-gradient(120% 90% at 50% 100%, #ffd9c2 0%, #f4f1ea 55%)' }} />

  {/* Capa 2: video scroll-scrubbed */}
  {VIDEO_RUTA_URL && (
    <video
      ref={videoRef}
      src={VIDEO_RUTA_URL}
      muted
      playsInline
      preload="auto"
      className="absolute inset-0 w-full h-full object-cover"
    />
  )}

  {/* Capa 3: escena placeholder (solo si no hay video) */}
  {!VIDEO_RUTA_URL && (
  <div className="absolute inset-0 flex flex-col">
          <div className="flex-1" />
          <div className="px-5 sm:px-8 md:px-12 pb-24 flex items-end justify-between gap-4">
            {vehicles.map(function(v, i) {
              const active = i === chapter, passed = i < chapter;
              return (
                <div key={i} className={"transition-all duration-500 " + (passed ? '-translate-x-[120%] opacity-0' : '')}>
                  <I name={v} size={active ? 40 : 28} className={active ? 'text-signal scale-110' : 'text-ink/60'} />
                </div>
              );
            })}
          </div>
        </div>
        )}
        {!VIDEO_RUTA_URL && (
        <div key={chapter} className="absolute top-1/2 left-1/2 -translate-x-1/2 anim-drop">
          <div className="w-10 h-10 bg-signal rounded-md shadow-lg"></div>
        </div>
        )}
        <div className="absolute top-6 right-6 sm:top-10 sm:right-10 flex items-center gap-3">
          <span className="font-mono text-xs text-ink">0{chapter+1} / 03</span>
          <div className="w-24 h-0.5 bg-ink/20 relative overflow-hidden">
            <div className="absolute inset-y-0 left-0 bg-signal" style={{ width: (p*100) + "%" }} />
          </div>
        </div>
        <div className="absolute bottom-6 left-5 sm:left-8 md:left-12 max-w-sm">
          <div className="font-mono text-[10px] uppercase tracking-[0.18em] text-signal drop-shadow-md">{captions[chapter].cap}</div>
          <div className="font-display text-xl sm:text-2xl font-bold text-ink drop-shadow-md">{captions[chapter].line}</div>
        </div>
        <div className={"absolute bottom-6 left-1/2 -translate-x-1/2 flex flex-col items-center gap-1 transition-opacity duration-500 " + (showHint ? 'opacity-100' : 'opacity-0')}>
          <span className="font-mono text-[10px] uppercase tracking-[0.18em] text-ink/60">desliza para viajar</span>
          <I name="chevron-down" size={16} className="text-ink/60 anim-bounce-y" />
        </div>
      </div>
    </section>
  );
}
